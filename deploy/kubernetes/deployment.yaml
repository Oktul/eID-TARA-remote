# SPDX-License-Identifier: EUPL-1.2
#
# The relay on Kubernetes (PLAN.md §10 O-7); the preStop sleep needs
# Kubernetes 1.30 or later. Fill in the settings below, then create the
# credential Secret from your file (docs/SETUP.md §5) instead of filling in
# secret.yaml, which is easy to commit by mistake:
#   kubectl -n <namespace> create secret generic \
#     eid-forge-remote-upstream-auth --from-file=upstream-auth=<file>
# Delete secret.yaml from your copy, so applying the directory cannot
# overwrite the Secret with the placeholder, and run `kubectl -n <namespace>
# apply -f deploy/kubernetes/`. Expose the Service only through your ingress
# controller, with the proxy limits of PLAN.md §6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eid-forge-remote
  labels:
    app.kubernetes.io/name: eid-forge-remote
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eid-forge-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eid-forge-remote
    spec:
      # The relay never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Service links inject variables such as RELAY_PORT for a Service named
      # "relay", which the relay would read as its own settings (PLAN.md §8).
      enableServiceLinks: false
      # Longer than the preStop sleep (5s) plus RELAY_SHUTDOWN_GRACE (15s), so
      # in-flight requests finish before the kubelet kills the process
      # (PLAN.md §6 R-11).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Gives the relay's group read access to the mounted credential.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          # OWNER is the GitHub owner, still open (PLAN.md §15 Q6). The
          # version is pinned by default; to follow :X.Y patches instead, use
          # imagePullPolicy: Always and a scheduled rollout restart
          # (PLAN.md §12).
          image: ghcr.io/OWNER/eid-forge-remote:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Replace these with the block from the eID SSO admin page
            # (PLAN.md §8). The relay refuses to start until they are valid.
            - name: RELAY_APP_ID
              value: "<from the admin page>"
            - name: RELAY_ENVIRONMENT_ID
              value: "<from the admin page>"
            - name: RELAY_CLOUD_IDS
              value: "<from the admin page>"
            - name: RELAY_UPSTREAM_URL
              value: "<from the admin page>"
            # TARA's Basic credential stays in the Secret (PLAN.md §5).
            - name: RELAY_UPSTREAM_AUTH_FILE
              value: /run/secrets/relay/upstream-auth
          volumeMounts:
            - name: upstream-auth
              mountPath: /run/secrets/relay
              readOnly: true
          lifecycle:
            # A stopping pod leaves the Service's endpoints while this hook
            # runs, and ingresses notice a moment later. SIGTERM, which closes
            # the relay's listener, comes only after the sleep, so no new
            # connection is refused in between (PLAN.md §6 R-11; §12 rollout
            # restarts). The kubelet sleeps itself: the image has no shell.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # The image sets GOMEMLIMIT=96MiB below this (PLAN.md §6 R-4).
              memory: 128Mi
          # Both probes bypass the forwarding limit, so a busy relay answers
          # them and is not restarted (PLAN.md §4.2, §6).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
      volumes:
        - name: upstream-auth
          secret:
            secretName: eid-forge-remote-upstream-auth
            defaultMode: 0440
