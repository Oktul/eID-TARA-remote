#
# PLACEHOLDER ONLY: do not fill it in, since a filled-in copy is easy to
# commit by mistake. Create the Secret from your credential file instead
# (docs/SETUP.md §5, PLAN.md §10 O-7):
#   kubectl -n <namespace> create secret generic \
#     eid-forge-remote-upstream-auth --from-file=upstream-auth=<file>
# Then delete this file from your copy, so that applying the directory
# cannot overwrite the Secret with the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: eid-forge-remote-upstream-auth
  labels:
    app.kubernetes.io/name: eid-forge-remote
type: Opaque
stringData:
  # Not a valid header, so a relay given this Secret refuses to start
  # (PLAN.md §6 R-13).
  upstream-auth: "<Authorization: Basic base64(form_encoded_client_id:form_encoded_client_secret)>"
