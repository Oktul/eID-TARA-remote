#
# Cluster-internal only: the ingress controller reaches the relay here, and
# nothing outside the cluster does directly (PLAN.md §6).
apiVersion: v1
kind: Service
metadata:
  name: eid-tara-remote
  labels:
    app.kubernetes.io/name: eid-tara-remote
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eid-tara-remote
  ports:
    - name: http
      port: 8080
      targetPort: http
