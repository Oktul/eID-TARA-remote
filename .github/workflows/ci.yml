# Source and image checks on every push and pull request (PLAN.md §12
# ci.yml). release.yml calls it with the exact commit it is about to publish.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check; empty checks the commit that started the run
        type: string
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The scripts come from the run's own commit, so a call from main checks
      # an older release line with main's checks (PLAN.md §12).
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - name: No modules; one Go version for tests and image
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh module
      - name: Release scripts
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh release-lines
      - name: gofmt
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh gofmt
      - name: go vet
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh vet
      - name: staticcheck
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh staticcheck
      - name: go test -race
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh test
      - name: govulncheck
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh govulncheck
      - name: gitleaks
        working-directory: src
        run: ../tools/.github/scripts/source-checks.sh gitleaks

  # Phase 2 image checks (PLAN.md §14). Kept as the last job so that it can
  # be split out; each architecture runs natively, without emulation.
  docker:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false
      # BuildKit pinned by digest, the same in release.yml and
      # go-patch-line.yml.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build the image
        working-directory: src
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$PLATFORM" --load --tag relay-ci:smoke .
      - name: Smoke test
        run: tools/.github/scripts/smoke.sh relay-ci:smoke
